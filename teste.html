
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introdução ao CSS & Estilização Inline — Aula Completa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-alt: #F1F5F9;
      --bg-code: #0F172A;
      --border-color: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --accent-blue: #0284C7;
      --accent-blue-soft: rgba(2, 132, 199, 0.1);
      --accent-orange: #EA580C;
      --accent-orange-soft: rgba(234, 88, 12, 0.1);
      --accent-green: #059669;
      --accent-green-soft: rgba(5, 150, 105, 0.1);
      --accent-amber: #D97706;
      --accent-amber-soft: rgba(217, 119, 6, 0.1);
      --accent-purple: #7C3AED;
      --accent-purple-soft: rgba(124, 58, 237, 0.1);
      --code-inline-bg: #E2E8F0;
      --code-inline-text: #0F172A;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 28px -6px rgba(15, 23, 42, 0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg-canvas: #0B0F17;
      --bg-surface: #131B2E;
      --bg-surface-alt: #1A243B;
      --bg-code: #070A10;
      --border-color: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-blue: #38BDF8;
      --accent-blue-soft: rgba(56, 189, 248, 0.14);
      --accent-orange: #FB923C;
      --accent-orange-soft: rgba(251, 146, 60, 0.14);
      --accent-green: #34D399;
      --accent-green-soft: rgba(52, 211, 153, 0.14);
      --accent-amber: #FBBF24;
      --accent-amber-soft: rgba(251, 191, 36, 0.14);
      --accent-purple: #A78BFA;
      --accent-purple-soft: rgba(167, 139, 250, 0.14);
      --code-inline-bg: #1E293B;
      --code-inline-text: #38BDF8;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 14px 34px -8px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Inline code pill */
    code {
      font-family: var(--font-mono);
      font-size: 0.84em;
      background-color: var(--code-inline-bg);
      color: var(--code-inline-text);
      padding: 2px 6px;
      border-radius: 5px;
      font-weight: 500;
    }

    /* Header Bar */
    .deck-header {
      height: 60px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .css-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .css-badge span strong {
      color: var(--accent-blue);
    }

    .header-divider {
      color: var(--border-strong);
    }

    .block-pill {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 99px;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .time-pill {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--bg-surface-alt);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface-alt);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .icon-btn {
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 0 8px;
      color: var(--text-primary);
    }

    .counter-sep {
      color: var(--text-muted);
      margin: 0 2px;
    }

    .nav-arrows {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      background: var(--bg-surface-alt);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--accent-blue);
      color: #FFFFFF;
      border-color: var(--accent-blue);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Main Stage & Slide Container */
    .deck-stage {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .slide-viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 28px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* Slide Header Texts */
    .slide-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 2.3vw, 2.25rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .slide-subtitle {
      font-size: 0.98rem;
      line-height: 1.5;
      color: var(--text-secondary);
      max-width: 920px;
      margin-bottom: 20px;
    }

    /* Responsive Grids (All items have min-width: 0 so NOTHING ever overflows!) */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .grid-asymmetric {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 22px;
      align-items: stretch;
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .card-blue-top { border-top: 4px solid var(--accent-blue); }
    .card-orange-top { border-top: 4px solid var(--accent-orange); }
    .card-green-top { border-top: 4px solid var(--accent-green); }
    .card-amber-top { border-top: 4px solid var(--accent-amber); }
    .card-purple-top { border-top: 4px solid var(--accent-purple); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .card p {
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* Clean Bullet Lists (Properly wraps inline tags and text!) */
    .clean-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clean-list li {
      position: relative;
      padding-left: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text-secondary);
      overflow-wrap: break-word;
    }

    .clean-list li::before {
      content: "▸";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-blue);
      font-weight: bold;
    }

    .clean-list li strong {
      color: var(--text-primary);
    }

    /* Property Cheat-Sheet Table / Rows (Slide 8 - Never breaks or overflows!) */
    .prop-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prop-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--bg-surface-alt);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .prop-row code {
      background: var(--bg-code);
      color: #38BDF8;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      display: inline-block;
      white-space: nowrap;
      overflow-x: auto;
    }

    .prop-row span {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Code Window */
    .code-window {
      background: var(--bg-code);
      border: 1px solid #1E293B;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .code-header {
      background: #1E293B;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .window-dots {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .window-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }

    .code-filename {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #CBD5E1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .code-body {
      padding: 16px 18px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.6;
      color: #E2E8F0;
      overflow-x: auto;
      white-space: pre;
    }

    .code-body code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    /* Syntax Colors inside Code Window */
    .tg { color: #FB923C; font-weight: 600; }
    .at { color: #38BDF8; }
    .pr { color: #C084FC; }
    .vl { color: #86EFAC; }
    .cm { color: #64748B; font-style: italic; }
    .nu { color: #FBBF24; }

    /* Interactive Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
      padding: 9px 16px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #FFFFFF;
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    /* Callouts */
    .callout {
      background: var(--accent-blue-soft);
      border-left: 4px solid var(--accent-blue);
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin-top: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .callout-green {
      background: var(--accent-green-soft);
      border-left-color: var(--accent-green);
    }

    .callout-amber {
      background: var(--accent-amber-soft);
      border-left-color: var(--accent-amber);
    }

    .callout-orange {
      background: var(--accent-orange-soft);
      border-left-color: var(--accent-orange);
    }

    /* House Analogy Stage */
    .house-stage {
      background: #0F172A;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      box-shadow: var(--shadow-md);
    }

    /* Simulated Web Browser Mockup (Slide 5) */
    .browser-mockup {
      background: #FFFFFF;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      height: 430px;
      min-width: 0;
    }

    .browser-chrome {
      background: #1E293B;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .browser-url-bar {
      flex: 1;
      background: #0F172A;
      color: #94A3B8;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .browser-viewport {
      flex: 1;
      overflow-y: auto;
      background: #FFFFFF;
      color: #000000;
    }

    .browser-viewport.raw-html-mode {
      font-family: 'Times New Roman', Times, serif;
      padding: 14px;
      background: #FFFFFF;
      color: #000000;
    }

    .browser-viewport.raw-html-mode h1 {
      font-size: 1.65rem;
      margin-bottom: 6px;
    }

    .browser-viewport.raw-html-mode nav a {
      color: #0000EE;
      text-decoration: underline;
      margin-right: 10px;
    }

    .browser-viewport.raw-html-mode table {
      border: 1px solid #000;
      margin: 10px 0;
    }

    .browser-viewport.raw-html-mode th,
    .browser-viewport.raw-html-mode td {
      border: 1px solid #000;
      padding: 3px 6px;
    }

    /* Syntax Anatomy Box (Slide 7) */
    .syntax-anatomy-box {
      background: var(--bg-code);
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 1.05rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #E2E8F0;
      box-shadow: var(--shadow-md);
    }

    .syn-part {
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
    }

    .syn-part:hover, .syn-part.active {
      border-color: #38BDF8;
      background: rgba(56, 189, 248, 0.2);
      transform: translateY(-1px);
    }

    /* Box Model Diagram (Slide 7) */
    .box-model-diagram {
      background: #FFF7ED;
      border: 2px dashed #EA580C;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: #C2410C;
    }

    [data-theme="dark"] .box-model-diagram {
      background: rgba(249, 115, 22, 0.12);
      color: #FDBA74;
    }

    .box-model-border {
      background: #FEFCE8;
      border: 3px solid #EAB308;
      border-radius: 8px;
      padding: 14px;
      color: #A16207;
      margin-top: 6px;
    }

    [data-theme="dark"] .box-model-border {
      background: rgba(250, 204, 21, 0.12);
      color: #FEF08A;
    }

    .box-model-padding {
      background: #ECFDF5;
      border: 2px dashed #10B981;
      border-radius: 6px;
      padding: 14px;
      color: #047857;
      margin-top: 6px;
    }

    [data-theme="dark"] .box-model-padding {
      background: rgba(16, 185, 129, 0.12);
      color: #A7F3D0;
    }

    .box-model-content {
      background: #0284C7;
      border-radius: 6px;
      padding: 12px;
      color: #FFFFFF;
      font-weight: 700;
      margin-top: 6px;
    }

    /* Modal Agenda */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 32px;
    }

    .modal-backdrop.hidden { display: none; }

    .modal-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 1100px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }

    .modal-header {
      padding: 20px 26px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .agenda-grid {
      padding: 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .agenda-item {
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .agenda-item:hover, .agenda-item.current {
      border-color: var(--accent-blue);
      background: var(--accent-blue-soft);
    }

    .agenda-item-top {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-blue);
    }

    .agenda-item-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    /* Progress Footer */
    .deck-footer {
      height: 5px;
      background: var(--border-color);
      width: 100%;
      flex-shrink: 0;
    }

    .progress-track { width: 100%; height: 100%; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-blue), var(--accent-green));
      width: 6%;
      transition: width 0.25s ease;
    }

    @media (max-width: 1080px) {
      .grid-2, .grid-3, .grid-asymmetric {
        grid-template-columns: 1fr;
      }
      .slide-viewport {
        padding: 20px 24px;
      }
      .prop-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <!-- Barra Superior Limpa -->
  <header class="deck-header">
    <div class="header-left">

      // =====================================================================
      // SLIDE 6: As 3 Formas de Aplicar CSS
      // =====================================================================
      const methodsData = [
        {
          title: "1. CSS Inline (Direto na Tag HTML)",
          tag: "Foco Exclusivo de Hoje 🎯",
          points: [
            "Escrito diretamente dentro da tag de abertura HTML através do atributo <strong><code>style=\"...\"</code></strong>.",
            "<strong>Como funciona:</strong> Estiliza exclusivamente aquela tag onde foi aplicado.",
            "<strong>Por que começamos por ele hoje?</strong> Porque você visualiza a tag HTML e o efeito visual no mesmo lugar, memorizando rapidamente o nome das propriedades!",
            "<strong>Curiosidade de Hierarquia:</strong> O CSS Inline tem a maior prioridade entre os 3 métodos."
          ],
          codeFile: "index.html (CSS Inline na própria tag)",
          code: `&lt;<span class="tg">body</span>&gt;
  &lt;<span class="tg">header</span> <span class="at">style</span>=<span class="vl">"background-color: #1E293B; padding: 20px;"</span>&gt;
    &lt;<span class="tg">h1</span> <span class="at">style</span>=<span class="vl">"color: #38BDF8; text-align: center;"</span>&gt;
      Título com CSS Inline
    &lt;/<span class="tg">h1</span>&gt;
  &lt;/<span class="tg">header</span>&gt;
&lt;/<span class="tg">body</span>&gt;`
        },
        {
          title: "2. CSS Interno ou Incorporado (Tag &lt;style&gt;)",
          tag: "Veremos na Próxima Aula",
          points: [
            "As regras CSS ficam agrupadas dentro de uma tag <strong><code>&lt;style&gt;...&lt;/style&gt;</code></strong> posicionada dentro do <code>&lt;head&gt;</code> da página.",
            "<strong>Vantagem:</strong> Permite estilizar todos os elementos de uma mesma página de uma só vez usando seletores.",
            "<strong>Limitação:</strong> Vale apenas para aquele arquivo HTML onde a tag <code>&lt;style&gt;</code> foi escrita."
          ],
          codeFile: "index.html (Tag &lt;style&gt; dentro do &lt;head&gt;)",
          code: `&lt;<span class="tg">head</span>&gt;
  &lt;<span class="tg">style</span>&gt;
    <span class="tg">h1</span> {
      <span class="pr">color</span>: <span class="vl">#38BDF8</span>;
      <span class="pr">text-align</span>: <span class="vl">center</span>;
    }
  &lt;/<span class="tg">style</span>&gt;
&lt;/<span class="tg">head</span>&gt;
&lt;<span class="tg">body</span>&gt;
  &lt;<span class="tg">h1</span>&gt;Título Estilizado pelo &lt;head&gt;&lt;/<span class="tg">h1</span>&gt;
&lt;/<span class="tg">body</span>&gt;`
        },
        {
          title: "3. CSS Externo (Arquivo .css Separado)",
          tag: "Padrão para Sites Multi-Páginas",
          points: [
            "Todo o estilo é salvo num arquivo dedicado (ex: <strong><code>estilo.css</code></strong>) conectado ao HTML pela tag <strong><code>&lt;link rel=\"stylesheet\" href=\"estilo.css\"&gt;</code></strong>.",
            "<strong>Grande Vantagem:</strong> Um único arquivo <code>estilo.css</code> estiliza dezenas de páginas do mesmo site ao mesmo tempo.",
            "Usa exatamente as mesmas propriedades (<code>color</code>, <code>padding</code>, <code>border</code>) que você vai dominar hoje!"
          ],
          codeFile: "index.html + estilo.css",
          code: `<span class="cm">&lt;!-- No arquivo index.html: --&gt;</span>
&lt;<span class="tg">head</span>&gt;
  &lt;<span class="tg">link</span> <span class="at">rel</span>=<span class="vl">"stylesheet"</span> <span class="at">href</span>=<span class="vl">"estilo.css"</span>&gt;
&lt;/<span class="tg">head</span>&gt;

<span class="cm">/* No arquivo separado estilo.css: */</span>
<span class="tg">header</span> {
  <span class="pr">background-color</span>: <span class="vl">#1E293B</span>;
  <span class="pr">padding</span>: <span class="nu">20px</span>;
}`
        }
      ];

      window.switchMethodTab = function (idx) {
        const panel = document.getElementById('methods-content-panel');
        const tabs = document.querySelectorAll('#methods-tabs .tab-btn');
        if (!panel) return;
        tabs.forEach((b, i) => b.classList.toggle('active', i === idx));
        const item = methodsData[idx];
        panel.innerHTML = `
          <div class="card card-blue-top">
            <div class="card-header">
              <span class="card-title">${item.title}</span>
              <span class="card-tag">${item.tag}</span>
            </div>
            <ul class="clean-list">
              ${item.points.map(p => `<li>${p}</li>`).join('')}
            </ul>
          </div>
          <div class="code-window">
            <div class="code-header">
              <div class="window-dots"><span class="dot-red"></span><span class="dot-yellow"></span><span class="dot-green"></span></div>
              <span class="code-filename">${item.codeFile}</span>
            </div>
            <div class="code-body">${item.code}</div>
          </div>
        `;
      };

      // =====================================================================
      // SLIDE 7: Inspetor da Sintaxe style=""
      // =====================================================================
      const syntaxDetails = [
        {
          title: "1. Tag HTML de Abertura (<header>, <section>, <table>...)",
          rule: "O atributo style sempre é escrito dentro da TAG DE ABERTURA do elemento HTML (nunca na tag de fechamento </header>).",
          mistake: "❌ Erro comum: Tentar colocar style na tag de fechamento </header>."
        },
        {
          title: "2. O Atributo style=\"...\"",
          rule: "Escrevemos style= seguido de aspas duplas (\"). Todas as propriedades CSS daquela tag ficam juntas dentro desse mesmo par de aspas!",
          mistake: "❌ Erro comum: Abrir dois atributos style='' separados na mesma tag."
        },
        {
          title: "3. Declaração 1 — background-color: #1E293B;",
          rule: "O nome da PROPRIEDADE e o VALOR são separados por DOIS-PONTOS (:) e encerrados obrigatoriamente com PONTO E VÍRGULA (;).",
          mistake: "❌ Erro comum: Usar sinal de igual (background-color = blue) em vez de dois-pontos (:)."
        },
        {
          title: "4. Declaração 2 — color: white;",
          rule: "Altera a cor do texto. Graças ao ponto e vírgula anterior, podemos colocar várias propriedades em sequência na mesma linha!",
          mistake: "❌ Erro comum: Esquecer o ponto e vírgula (;) entre duas propriedades."
        },
        {
          title: "5. Declaração 3 — padding: 20px;\"",
          rule: "Adiciona 20 pixels de espaço interno entre a borda e o texto, fechando as aspas duplas ao final.",
          mistake: "❌ Erro comum: Esquecer a unidade de medida px (escrever padding: 20 em vez de padding: 20px)."
        }
      ];

      window.inspectSyntax = function (idx) {
        const panel = document.getElementById('syntax-explanation-panel');
        const parts = document.querySelectorAll('#syntax-box .syn-part');
        if (!panel) return;
        parts.forEach((p, i) => p.classList.toggle('active', i === idx));
        const item = syntaxDetails[idx] || syntaxDetails[0];
        panel.innerHTML = `
          <div class="card card-blue-top">
            <div class="card-header">
              <span class="card-title">🔍 ${item.title}</span>
              <span class="card-tag">Regra de Sintaxe</span>
            </div>
            <p>${item.rule}</p>
            <div class="callout callout-orange" style="margin-top:auto;">
              <strong>${item.mistake}</strong>
            </div>
          </div>
          <div class="box-model-diagram">
            MARGIN (Espaço Externo — Afasta os elementos vizinhos)
            <div class="box-model-border">
              BORDER (Borda da Tag — ex: 2px solid #0284C7)
              <div class="box-model-padding">
                PADDING (Espaço Interno — Respiro dentro da caixa)
                <div class="box-model-content">
                  CONTEÚDO DA TAG (Texto, Vídeo, Imagem)
                </div>
              </div>
            </div>
          </div>
        `;
      };

      // =====================================================================
      // SLIDE 8: Dicionário de Propriedades em Abas + Playground
      // =====================================================================
      const propFamilies = [
        [
          { code: "background-color: #1E293B;", desc: "Define a cor de fundo do elemento (aceita nome ou código Hex)." },
          { code: "color: #FFFFFF;", desc: "Define a cor da letra (texto) dentro da tag." },
          { code: "font-family: Arial, sans-serif;", desc: "Altera o tipo da fonte do texto." },
          { code: "font-size: 24px;", desc: "Define o tamanho da letra em pixels." },
          { code: "text-align: center;", desc: "Alinha o texto (left, center, right ou justify)." },
          { code: "text-decoration: none;", desc: "Remove o sublinhado padrão dos links <a>." }
        ],
        [
          { code: "padding: 20px;", desc: "Espaço INTERNO entre a borda da caixa e o conteúdo." },
          { code: "margin: 0;", desc: "Remove a margem EXTERNA padrão (muito usado no <body>)." },
          { code: "margin: 24px auto;", desc: "Centraliza horizontalmente um bloco que possui largura definida." },
          { code: "max-width: 900px;", desc: "Limita a largura máxima (ótimo para o <main> não espalhar na tela)." },
          { code: "width: 100%;", desc: "Faz vídeos, áudios, inputs e tabelas ocuparem toda a largura." }
        ],
        [
          { code: "border: 1px solid #334155;", desc: "Cria uma borda informando: espessura, estilo (solid) e cor." },
          { code: "border-left: 6px solid #F59E0B;", desc: "Cria uma barra de destaque apenas na lateral esquerda (ótimo para <aside>)." },
          { code: "border-radius: 12px;", desc: "Arredonda os cantos de cards, vídeos, inputs e botões." },
          { code: "border-collapse: collapse;", desc: "Une as bordas duplas da tag <table> deixando o visual limpo." },
          { code: "cursor: pointer;", desc: "Muda a seta do mouse para a 'mãozinha de clique' no <button>." }
        ]
      ];

      window.switchPropFamily = function (idx) {
        const container = document.getElementById('prop-family-content');
        const tabs = document.querySelectorAll('#prop-family-tabs .tab-btn');
        if (!container) return;
        tabs.forEach((b, i) => b.classList.toggle('active', i === idx));
        const rows = propFamilies[idx] || propFamilies[0];
        container.innerHTML = rows
          .map(r => `
            <div class="prop-row">
              <code>${r.code}</code>
              <span>${r.desc}</span>
            </div>
          `)
          .join('');
      };

      window.updateCssPlayground = function (prop, val) {
        cssPgState[prop] = val;
        const preview = document.getElementById('css-pg-preview');
        const code = document.getElementById('css-pg-code');
        if (!preview || !code) return;

        preview.style.backgroundColor = cssPgState.bg;
        preview.style.padding = cssPgState.pad;
        preview.style.borderRadius = cssPgState.rad;
        preview.style.textAlign = cssPgState.align;

        code.innerHTML = `&lt;<span class="tg">section</span> <span class="at">style</span>=<span class="vl">"background-color: ${cssPgState.bg}; color: white; padding: ${cssPgState.pad}; border-radius: ${cssPgState.rad}; text-align: ${cssPgState.align};"</span>&gt;`;
      };

      // =====================================================================
      // NAVEGAÇÃO E ATALHOS
      // =====================================================================
      function goNext() {
        if (currentIndex < COURSE_SLIDES.length - 1) {
          currentIndex++;
          renderSlide(currentIndex);
        }
      }

      function goPrev() {
        if (currentIndex > 0) {
          currentIndex--;
          renderSlide(currentIndex);
        }
      }

      function toggleAgenda() {
        const isHidden = agendaModal.classList.contains('hidden');
        if (isHidden) {
          agendaGrid.innerHTML = COURSE_SLIDES
            .map((s, idx) => `
              <div class="agenda-item ${idx === currentIndex ? 'current' : ''}" data-idx="${idx}">
                <div class="agenda-item-top">
                  <span>Slide ${String(idx + 1).padStart(2, '0')}</span>
                  <span>${s.timeRange}</span>
                </div>
                <div class="agenda-item-title">${s.title}</div>
                <div style="font-size:0.75rem; color:var(--text-secondary);">${s.block}</div>
              </div>
            `)
            .join('');

          agendaGrid.querySelectorAll('.agenda-item').forEach(el => {
            el.addEventListener('click', () => {
              currentIndex = Number(el.getAttribute('data-idx'));
              renderSlide(currentIndex);
              agendaModal.classList.add('hidden');
            });
          });
          agendaModal.classList.remove('hidden');
        } else {
          agendaModal.classList.add('hidden');
        }
      }

      function toggleTheme() {
        const root = document.documentElement;
        const current = root.getAttribute('data-theme') || 'light';
        root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      function bindEvents() {
        btnNext.addEventListener('click', goNext);
        btnPrev.addEventListener('click', goPrev);
        btnAgenda.addEventListener('click', toggleAgenda);
        btnCloseAgenda.addEventListener('click', toggleAgenda);
        btnTheme.addEventListener('click', toggleTheme);
        btnFullscreen.addEventListener('click', toggleFullscreen);

        agendaModal.addEventListener('click', (e) => {
          if (e.target === agendaModal) agendaModal.classList.add('hidden');
        });

        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'PageDown') {
            e.preventDefault();
            goNext();
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            goPrev();
          } else if (e.key === 'm' || e.key === 'M') {
            toggleAgenda();
          } else if (e.key === 't' || e.key === 'T') {
            toggleTheme();
          } else if (e.key === 'f' || e.key === 'F') {
            toggleFullscreen();
          } else if (e.key === 'Escape') {
            agendaModal.classList.add('hidden');
          }
        });
      }

      init();
    })();
  </script>
